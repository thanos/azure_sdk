name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ELIXIR_VERSION: "1.19"
  OTP_VERSION: "28"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish-hex:
    name: Publish to Hex.pm
    runs-on: ubuntu-latest
    environment: release
    services:
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite
        ports:
          - 10000:10000
          - 10001:10001
          - 10002:10002
    env:
      AZURITE: "true"
      PROPERTY: "true"
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4.2.3
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --cover

      - name: Verify changelog entry
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          grep -qF "## v${VERSION}" CHANGELOG.md || {
            echo "CHANGELOG.md does not contain entry for v${VERSION}"
            exit 1
          }

      - name: Build Hex package
        run: mix hex.build

      - name: Publish to Hex.pm
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-hex]
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Build docs
        run: mix docs

      - name: Package docs
        run: tar -czf docs.tar.gz -C doc .

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Find release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -f "RELEASE_NOTES.md" ]; then
            echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          else
            echo "path=CHANGELOG.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            CHANGELOG.md
            docs.tar.gz
